<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Cybersecurity SOC Agent</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background-color: #121212; color: #e0e0e0; padding: 20px; }
        h1 { color: #00bcd4; }
        .pipeline-box { background: #1e1e1e; border: 2px solid #00bcd4; padding: 10px; margin-bottom: 20px; text-align: center; font-weight: bold; }
        .arrows { text-align: center; color: #00bcd4; font-size: 20px; margin: 5px 0; }
        .summary-container { display: flex; gap: 20px; margin-bottom: 30px; }
        .summary-box { background: #1e1e1e; padding: 15px; border-radius: 8px; text-align: center; flex-grow: 1; }
        .summary-number { font-size: 2em; font-weight: bold; }
        .crit-num { color: #f44336; }
        .high-num { color: #ff9800; }
        .low-num { color: #4caf50; }
        .total-num { color: #00bcd4; }
        .card { background: #1e1e1e; border-radius: 8px; padding: 15px; margin-bottom: 15px; border-left: 6px solid #555; }
        .critical { border-left-color: #f44336; }
        .high { border-left-color: #ff9800; }
        .low { border-left-color: #4caf50; }
        .header { display: flex; justify-content: space-between; margin-bottom: 10px; }
        .badge { background-color: #333; padding: 3px 8px; border-radius: 4px; font-size: 0.8em; }
        .btn-approve { background-color: #00bcd4; color: #000; border: none; padding: 5px 15px; cursor: pointer; border-radius: 5px; font-weight: bold; }
        .btn-approve:hover { background-color: #00acc1; }
    </style>
</head>
<body>
    <h1>AI Cybersecurity SOC Agent</h1>
    
    <h2>Incident Summary</h2>
    <div class="summary-container">
        <div class="summary-box"><div class="summary-number crit-num" id="crit">0</div>Critical</div>
        <div class="summary-box"><div class="summary-number high-num" id="high">0</div>High</div>
        <div class="summary-box"><div class="summary-number low-num" id="low">0</div>Low</div>
        <div class="summary-box"><div class="summary-number total-num" id="total">0</div>Total Alerts</div>
    </div>

    <h2>Agent Pipeline</h2>
    <div style="max-width: 600px; margin: 0 auto;">
        <div class="pipeline-box">Log Analysis Agent</div>
        <div class="arrows">▼</div>
        <div class="pipeline-box">Threat Detection Agent</div>
        <div class="arrows">▼</div>
        <div class="pipeline-box">Threat Intelligence Agent</div>
        <div class="arrows">▼</div>
        <div class="pipeline-box">Risk Assessment Agent</div>
        <div class="arrows">▼</div>
        <div class="pipeline-box" style="border-color: #ff9800;">Incident Response Agent</div>
        <div class="arrows">▼</div>
        <div class="pipeline-box" style="border-color: #4caf50; color: #4caf50;">Human Approval</div>
    </div>

    <h2 style="margin-top: 30px;">Live Alerts</h2>
    <div id="logs-container"></div>

    <script>
        async function loadSummary(logs) {
            let critical = 0, high = 0, low = 0;
            logs.forEach(log => {
                if (log.risk_level >= 8) critical++;
                else if (log.risk_level >= 5) high++;
                else low++;
            });
            document.getElementById('crit').innerText = critical;
            document.getElementById('high').innerText = high;
            document.getElementById('low').innerText = low;
            document.getElementById('total').innerText = logs.length;
        }

        async function loadLogs() {
            const response = await fetch('/api/logs');
            const logs = await response.json();
            const container = document.getElementById('logs-container');
            container.innerHTML = ''; 

            logs.forEach(log => {
                const div = document.createElement('div');
                let cardClass = 'card ';
                if (log.risk_level >= 8) cardClass += 'critical';
                else if (log.risk_level >= 5) cardClass += 'high';
                else cardClass += 'low';
                div.className = cardClass;
                div.innerHTML = `
                    <div class="header">
                        <strong>${log.threat}</strong> 
                        <span class="badge">Risk: ${log.risk_level}/10 | MITRE: ${log.mitre_id}</span>
                    </div>
                    <div><em>Description:</em> ${log.description}</div>
                    <div><em>Threat Intel Check:</em> ${log.intel}</div>
                    <div style="margin-top: 10px;"><strong>Recommendation:</strong> ${log.recommendation}</div>
                    <div style="margin-top: 15px; border-top: 1px solid #333; padding-top: 10px;">
                        <strong>Status: ${log.status}</strong>
                        <button class="btn-approve" onclick="approveAction('${log.ip}', '${log.recommendation}')">Approve & Execute</button>
                    </div>
                `;
                container.appendChild(div);
            });
            loadSummary(logs);
        }

        async function approveAction(ip, recommendation) {
            const response = await fetch('/api/approve', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ ip: ip, recommendation: recommendation })
            });
            const result = await response.json();
            alert(result.details); 
            loadLogs();
        }

        window.onload = loadLogs;
        setInterval(loadLogs, 5000);
    </script>
</body>
</html>
